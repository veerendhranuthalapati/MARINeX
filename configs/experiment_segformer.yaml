model:
  name: segformer
  in_channels: 3
  num_classes: 1
  embed_dims: [32, 64, 128, 256]
  decoder_dim: 128

data:
  dataset_root: data/datasets/sentinel1_primary
  channels: VV_VH_DIFF
  tile_size: 256
  overlap_ratio: 0.25
  batch_size: 8
  normalization: percentile
  clip_percentiles: [2.0, 98.0]

training:
  epochs: 12
  optimizer: adamw
  learning_rate: 0.0008
  weight_decay: 0.0001
  loss: bce_dice
  early_stopping_patience: 5
  seed: 42

calibration:
  threshold_sweep: [0.1, 0.2, 0.3, 0.4, 0.45, 0.5, 0.6, 0.7, 0.8, 0.9]
  target_metric: dice
